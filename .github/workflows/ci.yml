name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest -q
      # Corrida completa sin LLM sobre el dataset de ejemplo (no usa API keys)
      - run: foco eval --theme elecciones --keywords debate,encuesta,fraude,voto,inflacion,candidato --provider none
      # BERTopic no se instala en CI (torch pesa ~2 GB); su test se saltea
      - run: foco compare --theme elecciones --keywords debate,encuesta,fraude,voto,inflacion,candidato --provider none --methods kmeans,lda --llm off
